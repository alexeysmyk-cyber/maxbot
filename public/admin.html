<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
    }

    .sidebar a:hover {
      background: #33334d;
    }

    .content {
      flex: 1;
      padding: 0;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>

</head>

<body>

  <div class="sidebar">
    <h3>Admin</h3>

    <a href="/admin/templates" target="contentFrame">📄 Templates</a>
    <a href="/admin/notifications" target="contentFrame">🔔 Notifications</a>
    <a href="/admin/roles" target="contentFrame">👥 Roles</a>
    <a href="/admin/queue" target="contentFrame">📬 Queue</a>
  </div>

  <div class="content">
    <iframe name="contentFrame" src="/admin/templates"></iframe>
  </div>

</body>
</html>
