<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Templates</title>

<style>
body { font-family: Arial; max-width: 1200px; margin:auto; }
.layout { display:flex; gap:20px; }
.left { flex:2 }
.right { flex:1 }

.card {
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}

textarea,input,select {
  width:100%;
  margin-bottom:10px;
}

.var {
  background:#333;
  color:#0f0;
  padding:4px;
  margin:3px;
  display:inline-block;
  cursor:pointer;
}
</style>

</head>

<body>

<h2>Templates</h2>

<div class="layout">

<div class="left">

<div class="card">
<h3>Create</h3>

<select id="new-key">
<option value="">select</option>
<option value="visit_create">visit_create</option>
<option value="visit_cancel">visit_cancel</option>
<option value="visit_move">visit_move</option>
<option value="visit_reminder">visit_reminder</option>
<option value="full_ready_lab_result">full_ready_lab_result</option>
<option value="part_ready_lab_result">part_ready_lab_result</option>
<option value="birthday_message">birthday_message</option>
<option value="feedback_message">feedback_message</option>
<option value="next_visit_reminder">next_visit_reminder</option>
</select>

<select id="new-channel">
<option value="MAX">MAX</option>
<option value="EMAIL">EMAIL</option>
</select>

<input id="new-subject" placeholder="subject"/>
<textarea id="new-text"></textarea>

<button onclick="create()">Create</button>

</div>

<div id="list"></div>

</div>

<div class="right">
<div class="card">
<h3>Variables</h3>

<div id="vars"></div>

</div>
</div>

</div>

<script>

let activeTextarea = null;

document.addEventListener('focusin', e=>{
  if(e.target.tagName==='TEXTAREA') activeTextarea = e.target;
});

function insertVar(v){
  if(!activeTextarea) return alert('Выбери поле');
  activeTextarea.value += v;
}

const VARIABLES = [
'patient_name','doctor_name','date','time_start','time_end',
'cabinet','clinic','phone','email',

// перенос
'old_date','new_date','old_doctor','new_doctor',

// отзыв
'review_link',

// доп
'author_name','status'
];

function renderVars(){
  const v = document.getElementById('vars');
  VARIABLES.forEach(x=>{
    const el=document.createElement('span');
    el.className='var';
    el.innerText='{{'+x+'}}';
    el.onclick=()=>insertVar('{{'+x+'}}');
    v.appendChild(el);
  });
}

async function load(){
  const res = await fetch('/api/templates');
  const data = await res.json();

  console.log('API RESPONSE:', data);

  const list = document.getElementById('list');
  list.innerHTML='';

  data.forEach(t=>{
    const div=document.createElement('div');
    div.className='card';

    let html='';
    html+='<h3>'+t.key+' ('+t.channel+')</h3>';

    if(t.channel==='EMAIL'){
      html+='<input id="s-'+t.id+'" value="'+(t.subject||'')+'"/>';
    }

    html+='<textarea id="t-'+t.id+'">'+(t.text||'')+'</textarea>';

```
html+='<button onclick="save('+t.id+')">Save</button>';
html+='<button onclick="preview('+t.id+')">Preview</button>';
html+='<button onclick="removeTemplate('+t.id+')">Delete</button>';
html+='<div id="p-'+t.id+'"></div>';

div.innerHTML=html;
list.appendChild(div);
```

});
}

async function save(id){
const text=document.getElementById('t-'+id).value;
const subjectEl=document.getElementById('s-'+id);

await fetch('/api/templates/update',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
id,
text,
subject:subjectEl?subjectEl.value:null
})
});

alert('saved');
}

async function preview(id){
const text=document.getElementById('t-'+id).value;

const res=await fetch('/api/templates/preview',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({text})
});

const r=await res.text();
document.getElementById('p-'+id).innerText=r;
}

async function create(){
const key=document.getElementById('new-key').value;
const channel=document.getElementById('new-channel').value;
const subject=document.getElementById('new-subject').value;
const text=document.getElementById('new-text').value;

await fetch('/api/templates/create',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key,channel,subject,text})
});

load();
}

async function removeTemplate(id){
await fetch('/api/templates/delete',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({id})
});

load();
}

renderVars();
load();

</script>

</body>
</html>
