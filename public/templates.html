<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Templates</title>

  <style>
    body {
      font-family: Arial;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .layout {
      display: flex;
      gap: 20px;
    }

    .left { flex: 2; }
    .right { flex: 1; }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    textarea, input, select {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 10px;
    }

    .var {
      display: inline-block;
      background: #333;
      color: #0f0;
      padding: 4px;
      margin: 2px;
      cursor: pointer;
    }

    .preview {
      background: black;
      color: #0f0;
      padding: 10px;
      margin-top: 10px;
    }
  </style>

</head>

<body>

<h2>Templates</h2>

<div class="layout">

<div class="left">

<div class="card">
  <h3>Create</h3>

  <select id="new-key">
    <option value="">select</option>
    <option value="visit_create">visit_create</option>
    <option value="visit_cancel">visit_cancel</option>
    <option value="visit_move">visit_move</option>
  </select>

  <select id="new-channel">
    <option value="MAX">MAX</option>
    <option value="EMAIL">EMAIL</option>
  </select>

  <input id="new-subject" placeholder="subject" />
  <textarea id="new-text"></textarea>

<button onclick="create()">Create</button>

</div>

<div id="list"></div>

</div>

<div class="right">

<div class="card">
  <h3>Variables</h3>

<span class="var" onclick="insertVar('{{patient_name}}')">{{patient_name}}</span> <span class="var" onclick="insertVar('{{doctor_name}}')">{{doctor_name}}</span> <span class="var" onclick="insertVar('{{date}}')">{{date}}</span>

</div>

</div>

</div>

<script>

let activeTextarea = null;

document.addEventListener('focusin', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    activeTextarea = e.target;
  }
});

function insertVar(v) {
  if (!activeTextarea) return;

  activeTextarea.value += v;
  activeTextarea.focus();
}

async function load() {
  const res = await fetch('/api/templates');
  const data = await res.json();

  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(function(t) {

    const div = document.createElement('div');
    div.className = 'card';

    // ❗ ВАЖНО: без template literal вложенных
    let html = '';

    html += '<h3>' + t.key + ' (' + t.channel + ')</h3>';

    if (t.channel === 'EMAIL') {
      html += '<input id="s-' + t.id + '" value="' + (t.subject || '') + '" />';
    }

    html += '<textarea id="t-' + t.id + '">' + (t.text || '') + '</textarea>';

```
html += '<button onclick="save(' + t.id + ')">Save</button>';
html += '<button onclick="preview(' + t.id + ')">Preview</button>';
html += '<button onclick="removeTemplate(' + t.id + ')">Delete</button>';

html += '<div id="p-' + t.id + '" class="preview"></div>';

div.innerHTML = html;

list.appendChild(div);
```

});
}

async function save(id) {
const text = document.getElementById('t-' + id).value;
const subjectEl = document.getElementById('s-' + id);

await fetch('/api/templates/update', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
id: id,
text: text,
subject: subjectEl ? subjectEl.value : null
})
});

alert('Saved');
}

async function preview(id) {
const text = document.getElementById('t-' + id).value;

const res = await fetch('/api/templates/preview', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ text: text })
});

const result = await res.text();
document.getElementById('p-' + id).innerText = result;
}

async function create() {
const key = document.getElementById('new-key').value;
const channel = document.getElementById('new-channel').value;
const subject = document.getElementById('new-subject').value;
const text = document.getElementById('new-text').value;

await fetch('/api/templates/create', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
key: key,
channel: channel,
subject: subject,
text: text
})
});

load();
}

async function removeTemplate(id) {
await fetch('/api/templates/delete', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ id: id })
});

load();
}

load();

</script>

</body>
</html>
