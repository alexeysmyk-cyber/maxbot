<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Templates</title>

  <style>
    body {
      font-family: Arial;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      background: #f7f7f7;
    }

    h2 {
      text-align: center;
    }

    .layout {
      display: flex;
      gap: 20px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 10px;
    }

    button {
      margin-right: 10px;
      margin-top: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .preview {
      background: #111;
      color: #0f0;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
      border-radius: 6px;
    }

    .vars {
      background: #222;
      color: #0f0;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .var {
      cursor: pointer;
      display: inline-block;
      margin: 3px;
      padding: 3px 6px;
      background: #333;
      border-radius: 4px;
    }

    .var:hover {
      background: #555;
    }

    .create {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>

</head>

<body>

<h2>📨 Notification Templates</h2>

<div class="layout">

<div class="left">

<!-- CREATE -->

<div class="create">
  <h3>➕ Create Template</h3>

  <select id="new-key">
    <option value="">-- select event --</option>
    <option value="visit_create">Запись на визит</option>
    <option value="visit_cancel">Отмена визита</option>
    <option value="visit_move">Перенос визита</option>
    <option value="visit_reminder">Напоминание</option>
    <option value="full_ready_lab_result">Анализы готовы</option>
    <option value="part_ready_lab_result">Анализы частично</option>
    <option value="birthday_message">День рождения</option>
    <option value="feedback_message">Отзыв</option>
    <option value="next_visit_reminder">Повторная явка</option>
  </select>

  <select id="new-channel">
    <option value="MAX">MAX</option>
    <option value="EMAIL">EMAIL</option>
  </select>

  <input id="new-subject" placeholder="subject (only EMAIL)" />

  <textarea id="new-text" rows="5" placeholder="template text"></textarea>

<button onclick="create()">Create</button>

</div>

<div id="list"></div>

</div>

<!-- VARIABLES -->

<div class="right">
  <div class="card">
    <h3>📌 Variables</h3>

  </div>
</div>

</div>

<script>

let activeTextarea = null;

// 🔥 фикс выбора textarea
document.addEventListener('focusin', (e) => {
  if (e.target.tagName === 'TEXTAREA') {
    activeTextarea = e.target;
  }
});

// 🔥 вставка переменной
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('var')) {
    const variable = e.target.dataset.var;

    if (!activeTextarea) {
      alert('Сначала кликни в поле текста');
      return;
    }

    const start = activeTextarea.selectionStart;
    const end = activeTextarea.selectionEnd;

    activeTextarea.value =
      activeTextarea.value.substring(0, start) +
      variable +
      activeTextarea.value.substring(end);

    activeTextarea.focus();
  }
});

// 🔥 load templates
async function load() {
  try {
    const res = await fetch('/api/templates');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    data.forEach(t => {
      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <h3>${t.key} (${t.channel})</h3>

        ${t.channel === 'EMAIL' ? `
          <b>Subject:</b>
          <input id="s-${t.id}" value="${t.subject || ''}" />
        ` : ''}

        <textarea id="t-${t.id}" rows="5">${t.text || ''}</textarea>

```
    <button onclick="save(${t.id})">💾 Save</button>
    <button onclick="preview(${t.id})">👁 Preview</button>
    <button onclick="removeTemplate(${t.id})">🗑 Delete</button>

    <div id="p-${t.id}" class="preview"></div>
  `;

  list.appendChild(div);
});
```

} catch (e) {
console.error('LOAD ERROR:', e);
}
}

// 🔥 save
async function save(id) {
const text = document.getElementById('t-' + id).value;
const subjectEl = document.getElementById('s-' + id);

await fetch('/api/templates/update', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
id,
text,
subject: subjectEl ? subjectEl.value : null
})
});

alert('Saved');
}

// 🔥 preview
async function preview(id) {
const text = document.getElementById('t-' + id).value;

const res = await fetch('/api/templates/preview', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ text })
});

const result = await res.text();
document.getElementById('p-' + id).innerText = result;
}

// 🔥 create
async function create() {
const key = document.getElementById('new-key').value;
const channel = document.getElementById('new-channel').value;
const subject = document.getElementById('new-subject').value;
const text = document.getElementById('new-text').value;

if (!key) {
alert('Выбери тип уведомления');
return;
}

await fetch('/api/templates/create', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
key,
channel,
subject,
text
})
});

alert('Created');

document.getElementById('new-text').value = '';
load();
}

// 🔥 delete
async function removeTemplate(id) {
if (!confirm('Удалить шаблон?')) return;

await fetch('/api/templates/delete', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ id })
});

load();
}

// старт
load();

</script>

</body>
</html>
