<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Templates</title>

<style>
body {
  font-family: Arial;
  max-width: 1200px;
  margin: auto;
  padding: 20px;
  background: #f7f7f7;
}

.layout {
  display: flex;
  gap: 20px;
}

.left { flex: 2 }
.right { flex: 1 }

.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}

textarea, input, select {
  width: 100%;
  margin-bottom: 10px;
}

button {
  margin-right: 5px;
  padding: 5px 10px;
}

.var {
  display: inline-block;
  background: #333;
  color: #0f0;
  padding: 5px;
  margin: 3px;
  border-radius: 4px;
  cursor: pointer;
}

.preview {
  background: black;
  color: #0f0;
  padding: 10px;
  margin-top: 10px;
  white-space: pre-wrap;
}
</style>

</head>

<body>

<h2>📨 Templates</h2>

<div class="layout">

<!-- LEFT -->

<div class="left">

<div class="card">
<h3>Create Template</h3>

<select id="new-key">
<option value="">select event</option>
<option value="visit_create">visit_create</option>
<option value="visit_cancel">visit_cancel</option>
<option value="visit_move">visit_move</option>
<option value="visit_reminder">visit_reminder</option>
<option value="full_ready_lab_result">full_ready_lab_result</option>
<option value="part_ready_lab_result">part_ready_lab_result</option>
<option value="birthday_message">birthday_message</option>
<option value="feedback_message">feedback_message</option>
<option value="next_visit_reminder">next_visit_reminder</option>
</select>

<select id="new-channel">
<option value="MAX">MAX</option>
<option value="EMAIL">EMAIL</option>
</select>

<input id="new-subject" placeholder="subject (EMAIL only)" />
<textarea id="new-text" placeholder="template text"></textarea>

<button onclick="create()">Create</button>

</div>

<div id="list"></div>

</div>

<!-- RIGHT -->

<div class="right">
<div class="card">
<h3>Variables</h3>
<div id="vars"></div>
</div>
</div>

</div>

<script>

// ===== ACTIVE TEXTAREA =====
let activeTextarea = null;

document.addEventListener('focusin', e => {
  if (e.target.tagName === 'TEXTAREA') {
    activeTextarea = e.target;
  }
});

// ===== VARIABLES =====
const VARIABLES = [
  'patient_name','doctor_name','date','time_start','time_end',
  'cabinet','clinic','phone','email',

  // перенос визита
  'old_date','new_date','old_doctor','new_doctor','old_time','new_time',

  // отзыв
  'review_link',

  // прочее
  'author_name','status'
];

// ===== RENDER VARIABLES =====
function renderVars() {
  const container = document.getElementById('vars');
  container.innerHTML = '';

  VARIABLES.forEach(v => {
    const el = document.createElement('span');
    el.className = 'var';
    el.innerText = '{{' + v + '}}';
    el.onclick = () => insertVar('{{' + v + '}}');
    container.appendChild(el);
  });
}

// ===== INSERT VARIABLE =====
function insertVar(v) {
  if (!activeTextarea) {
    alert('Сначала выбери поле текста');
    return;
  }

  const start = activeTextarea.selectionStart;
  const end = activeTextarea.selectionEnd;

  activeTextarea.value =
    activeTextarea.value.substring(0, start) +
    v +
    activeTextarea.value.substring(end);

  activeTextarea.focus();
}

// ===== LOAD TEMPLATES =====
async function load() {
  try {
    const res = await fetch('/api/templates');
    const data = await res.json();

    console.log('API RESPONSE:', data);

    if (!Array.isArray(data)) {
      console.error('НЕ МАССИВ:', data);
      return;
    }

    const list = document.getElementById('list');
    list.innerHTML = '';

    data.forEach(t => {

      const div = document.createElement('div');
      div.className = 'card';

      // TITLE
      const title = document.createElement('h3');
      title.innerText = t.key + ' (' + t.channel + ')';
      div.appendChild(title);

      // SUBJECT
      let subjectInput = null;
      if (t.channel === 'EMAIL') {
        subjectInput = document.createElement('input');
        subjectInput.id = 's-' + t.id;
        subjectInput.value = t.subject || '';
        div.appendChild(subjectInput);
      }

      // TEXTAREA (🔥 безопасно)
      const textarea = document.createElement('textarea');
      textarea.id = 't-' + t.id;
      textarea.value = t.text || '';
      div.appendChild(textarea);

      // BUTTONS
      const btnSave = document.createElement('button');
      btnSave.innerText = 'Save';
      btnSave.onclick = () => save(t.id);

      const btnPreview = document.createElement('button');
      btnPreview.innerText = 'Preview';
      btnPreview.onclick = () => preview(t.id);

      const btnDelete = document.createElement('button');
      btnDelete.innerText = 'Delete';
      btnDelete.onclick = () => removeTemplate(t.id);

      div.appendChild(btnSave);
      div.appendChild(btnPreview);
      div.appendChild(btnDelete);

      // PREVIEW
      const previewDiv = document.createElement('div');
      previewDiv.id = 'p-' + t.id;
      previewDiv.className = 'preview';
      div.appendChild(previewDiv);

      list.appendChild(div);
    });

  } catch (e) {
    console.error('LOAD ERROR:', e);
  }
}

// ===== SAVE =====
async function save(id) {
  const text = document.getElementById('t-' + id).value;
  const subjectEl = document.getElementById('s-' + id);

  await fetch('/api/templates/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      id,
      text,
      subject: subjectEl ? subjectEl.value : null
    })
  });

  alert('Saved');
}

// ===== PREVIEW =====
async function preview(id) {
  const text = document.getElementById('t-' + id).value;

  const res = await fetch('/api/templates/preview', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text })
  });

  const result = await res.text();
  document.getElementById('p-' + id).innerText = result;
}

// ===== CREATE =====
async function create() {
  const key = document.getElementById('new-key').value;
  const channel = document.getElementById('new-channel').value;
  const subject = document.getElementById('new-subject').value;
  const text = document.getElementById('new-text').value;

  if (!key) {
    alert('Выбери тип уведомления');
    return;
  }

  await fetch('/api/templates/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ key, channel, subject, text })
  });

  document.getElementById('new-text').value = '';
  load();
}

// ===== DELETE =====
async function removeTemplate(id) {
  if (!confirm('Удалить шаблон?')) return;

  const res = await fetch('/api/templates/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id })
  });

  const data = await res.json();

  console.log('DELETE RESPONSE:', data);

  if (!res.ok) {
    alert('Ошибка удаления');
    return;
  }

  load();
}

  if (!confirm('Удалить шаблон?')) return;

  await fetch('/api/templates/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id })
  });

  load();
}

// ===== INIT =====
renderVars();
load();

</script>

</body>
</html>
