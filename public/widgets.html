<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RNova Widgets Test</title>

    <script src="https://app.rnova.org/widgets"
            rel="preload"
            as="script"></script>

    <style>

        body{
            font-family:Arial,sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        .block{
            background:#fff;
            border:1px solid #ddd;
            border-radius:8px;
            padding:20px;
            margin-bottom:40px;
        }

        h2{
            margin-top:0;
        }

    </style>

</head>

<body>

<div class="block">

    <h2>Список услуг</h2>

    <div class="rnova-price_list"
         data-show_search="true"
         data-show_children="true">
    </div>

</div>

<div class="block">

    <h2>Карточка врача</h2>

    <div class="rnova-doctor"
         data-doctor_id="1">
    </div>

</div>

<div class="block">

    <h2>Личный кабинет пациента</h2>

    <div id="rnova-office"></div>

</div>

<div class="block">

    <h2>Видео / аудио консультация</h2>

    <div id="rnova-video_chat"></div>

</div>

<script>

window.rnovaWidgetsConfig = {

    consultationsConfig: {

        app_name: "",

        patient_login: "",

        patient_password: "",

        doctor_login: "",

        onSdkReady: function(){},

        onConnectionEstablished: function(){},

        onConnectionFailed: function(){},

        onConnectionClosed: function(){},

        onAuthResult: function(){},

        onMicAccessResult: function(){},

        onCallConnected: function(){},

        onCallDisconnected: function(){},

        onCallFailed: function(){},

        onMessageReceived: function(){}

    }

};

</script>

</body>

</html>
