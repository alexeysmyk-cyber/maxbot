<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RNova Widgets Test</title>

    <script src="https://app.rnova.org/widgets"></script>

    <style>

        body{
            margin:30px;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
        }

        .widget{
            background:#fff;
            border:1px solid #ddd;
            border-radius:8px;
            padding:20px;
            margin-bottom:30px;
        }

        h2{
            margin-top:0;
        }

    </style>

</head>

<body>

<div class="widget">

    <h2>Список услуг</h2>

    <div
        class="rnova-price_list"
        data-show_search="true"
        data-show_children="true">
    </div>

</div>

<div class="widget">

    <h2>Карточка врача</h2>

    <div
        class="rnova-doctor"
        data-doctor_id="43347">
    </div>

</div>

<div class="widget">

    <h2>Личный кабинет пациента</h2>

    <div id="rnova-office"></div>

</div>

</body>

</html>
