<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RNova Widget Test</title>

    <!-- Общий скрипт RNova -->
    <script src="https://app.rnova.org/widgets"
            rel="preload"
            as="script"></script>

    <style>
        body{
            margin:40px;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
        }

        .widget{
            background:#fff;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }
    </style>

</head>

<body>

<h2>Список услуг RNova</h2>

<div class="widget">

    <div class="rnova-price_list"

         data-clinic_id="2997"

         data-show_search="true"

         data-show_children="true">

    </div>

</div>

</body>

</html>
