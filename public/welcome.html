<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>СредА</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
rel="stylesheet">


<style>
/* ===== Redesigned responsive onboarding CSS ===== */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#eef2f5;
  --card:#fff;
  --text:#243238;
  --muted:#71808d;
  --border:#e8edf2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.container{
  width:100%;
  max-width:500px;
}

.card{
  background:var(--card);
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
  animation:fade .35s ease;
}

.logo{
  display:block;
  width:230px;
  max-width:85%;
  margin:0 auto 14px;
}

h1{
  text-align:center;
  color:var(--text);
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
}

p{
  text-align:center;
  color:var(--muted);
  font-size:15px;
  line-height:1.45;
  margin-bottom:18px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  height:60px;
  background:#fafcfd;
  border:1px solid var(--border);
  border-radius:18px;
  padding:0 16px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s;
}

.item:hover{
  transform:translateY(-1px);
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}

.item:active{
  transform:scale(.985);
}

.left{
  display:flex;
  align-items:center;
  min-width:0;
}

.icon{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:12px;
  flex-shrink:0;
}

.icon img{
  width:18px;
  height:18px;
}

.email{background:#dff2ff}
.max{background:#efe6ff}
.whatsapp{background:#e5f9ea}
.telegram{background:#dff1ff}
.sms{background:#ededed}

.left span{
  color:var(--text);
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item>.bx{
  font-size:22px;
  color:#a5b0ba;
}

.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.disabled:hover{
  transform:none;
  box-shadow:none;
  background:#fafcfd;
}

.footer{
  margin-top:10px;
  text-align:center;
  color:#8d98a5;
  font-size:12px;
  line-height:1.4;
}

@keyframes fade{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

@media (max-width:480px){
  body{padding:8px}
  .card{padding:16px;border-radius:22px}
  .logo{width:210px;margin-bottom:12px}
  h1{font-size:24px}
  p{font-size:14px;margin-bottom:14px}
  .item{height:56px;padding:0 14px;margin-bottom:8px}
  .icon{width:34px;height:34px;margin-right:10px}
  .icon img{width:16px;height:16px}
  .left span{font-size:15px}
  .footer{font-size:11px}
}

@media (min-width:900px){
  body{padding:30px}
  .container{max-width:480px}
}


</style>

</head>

<body>

<div class="container">

    <div class="card">
      <img  src="/images/logo.png" class="logo" alt="СредА">
      <h1> Добро пожаловать! </h1>
<p>
Выберите предпочтительный
канал получения уведомлений
</p>
<div
class="item"
onclick="select('EMAIL')">
    <div class="left">

<div class="icon email">

<img src="/images/icons/mail.svg">

</div>

<span>E-mail</span>

</div>
    <i class="bx bx-chevron-right"></i>
</div>
<div
class="item"
onclick="select('MAX')">
    <div class="left">

<div class="icon max">

<img src="/images/icons/max.svg">

</div>

<span>MAX Messenger</span>

</div>
    <i class="bx bx-chevron-right"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon whatsapp">

<img src="/images/icons/whatsapp.svg">

</div>

<span>WhatsApp</span>

</div>
    <i class="bx bx-lock"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon telegram">

<img src="/images/icons/telegram.svg">


</div>

<span>Telegram</span>

</div>
   <i class="bx bx-lock"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon sms">

<img src="/images/icons/sms.svg">

</div>

<span>SMS</span>

</div>
  <i class="bx bx-lock"></i>
</div>
<div class="footer">

Другие способы связи
появятся в ближайшее время.

</div>
</div>
</div>



<script>

const token = new URLSearchParams(window.location.search).get('token');

async function select(channel) {
  const res = await fetch('/api/onboarding/select-channel', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      token,
      channel
    })
  });

  const data = await res.json();

  if (channel === 'MAX') {
    window.location.href = data.link;
  } else {
    document.body.innerHTML = '<h3>✅ Вы выбрали Email</h3>';
  }
}

</script>

</body>
</html>
