<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>СредА</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
rel="stylesheet">


<style>

/* ===========================
   ОБЩИЕ НАСТРОЙКИ
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#eef2f4;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

/* ===========================
      КОНТЕЙНЕР
=========================== */

.container{
    width:100%;
    max-width:480px;
}

/* ===========================
        КАРТОЧКА
=========================== */

.card{
    background:#ffffff;
    border-radius:28px;
    padding:32px;
    box-shadow:
    0 20px 50px rgba(0,0,0,.08);
}

/* ===========================
          ЛОГО
=========================== */

.logo{
    width:185px;
    display:block;
    margin:auto;
    margin-bottom:28px;
}

/* ===========================
      ДОБРО ПОЖАЛОВАТЬ
=========================== */

h1{

    text-align:center;
    font-size:30px;
    font-weight:700;
    color:#233033;
   margin-bottom:18px;
}

p{
    text-align:center;
    color:#707b86;
    font-size:18px;
    line-height:1.55;
    margin-bottom:36px;
}
/* ===========================
        КАРТОЧКИ
=========================== */

.item{
    width:100%;
    border:1px solid #edf1f5;
    height:78px;
   background:hsl(200, 27%, 98%);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    margin-bottom:16px;
    cursor:pointer;
    transition:.25s;
    box-shadow:
   0 4px 18px rgba(0,0,0,.05);
}
.item:hover{
    transform:translateY(-2px);
    box-shadow:
    0 15px 35px rgba(0,0,0,.10);
}

.left{

    display:flex;

    align-items:center;

}
.icon{

    width:46px;

    height:46px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-right:18px;

    flex-shrink:0;

}
.email{

    background:#d8f0ff;

    color:#0b84ff;

}
.max{

    background:#efe4ff;

    color:#7a3cff;

}
.whatsapp{

    background:#dff8e8;

    color:#18b957;

}
.telegram{

    background:#dcefff;

    color:#1994ff;

}
.sms{

    background:#ececec;

    color:#6f7785;

}
.icon img{

width:22px;

height:22px;

object-fit:contain;

}
.left span{
    font-size:22px;
    font-weight:600;
    color:#263238;
}
.item>.bx{
  
font-size:24px;

color:#b7bec7;
}
.item:active{

transform:scale(.98);

}
.disabled{
    opacity:.45;
   cursor:default;
}
.disabled:hover{
    transform:none;
    box-shadow:
    0 8px 24px rgba(0,0,0,.06);
}

.footer{
    margin-top:18px;
    text-align:center;
    color:#8d98a8;
    font-size:15px;
    line-height:1.5;
}
@media (max-width:480px){

.card{
    padding:24px;
}
.logo{
    width:150px;
}
h1{
    font-size:36px;
}
p{
    font-size:18px;
}
.left span{
    font-size:20px;
}
.item{
    height:72px;
}
}
.card{

animation:fade .45s cubic-bezier(.2,.8,.2,1);

}
@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:none;

}

}
.item{

transition:

transform .2s,

box-shadow .2s,

background .2s;

}
.item:hover{

background:white;

}

</style>

</head>

<body>

<div class="container">

    <div class="card">
      <img  src="/images/logo.png" class="logo" alt="СредА">
      <h1> Добро пожаловать! </h1>
<p>
Выберите предпочтительный
канал получения уведомлений
</p>
<div
class="item"
onclick="select('EMAIL')">
    <div class="left">

<div class="icon email">

<img src="/images/icons/mail.svg">

</div>

<span>E-mail</span>

</div>
    <i class="bx bx-chevron-right"></i>
</div>
<div
class="item"
onclick="select('MAX')">
    <div class="left">

<div class="icon max">

<img src="/images/icons/max.svg">

</div>

<span>MAX Messenger</span>

</div>
    <i class="bx bx-chevron-right"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon whatsapp">

<img src="/images/icons/whatsapp.svg">

</div>

<span>WhatsApp</span>

</div>
    <i class="bx bx-lock"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon telegram">

<img src="/images/icons/telegram.svg">


</div>

<span>Telegram</span>

</div>
   <i class="bx bx-lock"></i>
</div>
<div class="item disabled">
    <div class="left">

<div class="icon sms">

<img src="/images/icons/sms.svg">

</div>

<span>SMS</span>

</div>
  <i class="bx bx-lock"></i>
</div>
<div class="footer">

Другие способы связи
появятся в ближайшее время.

</div>
</div>
</div>



<script>

const token = new URLSearchParams(window.location.search).get('token');

async function select(channel) {
  const res = await fetch('/api/onboarding/select-channel', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      token,
      channel
    })
  });

  const data = await res.json();

  if (channel === 'MAX') {
    window.location.href = data.link;
  } else {
    document.body.innerHTML = '<h3>✅ Вы выбрали Email</h3>';
  }
}

</script>

</body>
</html>
