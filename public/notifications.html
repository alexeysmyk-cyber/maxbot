<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Notifications</title>
</head>

<body>

<h2>Notification Settings</h2>

<select id="userSelect" onchange="render()">
</select>

<br><br>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Event</th>
      <th>Mode</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

let users = [];
let notifications = [];

async function load() {

  // 🔥 грузим ВСЕХ сотрудников
  const usersRes = await fetch('/api/users');
  users = await usersRes.json();

  // 🔥 грузим override
  const notifRes = await fetch('/api/notifications');
  notifications = await notifRes.json();

  console.log('USERS:', users);
  console.log('NOTIFICATIONS:', notifications);

  const select = document.getElementById('userSelect');
  select.innerHTML = '';

  users.forEach(user => {
    const option = document.createElement('option');
    option.value = user.id;
    option.textContent = user.name || `User ${user.id}`;
    select.appendChild(option);
  });

  render();
}

function render() {
  const selectedUserId = Number(document.getElementById('userSelect').value);
  const table = document.getElementById('table');

  table.innerHTML = '';

  // 🔥 берём все типы (через notifications или fallback)
  const userNotifs = notifications.filter(n => n.userId === selectedUserId);

  userNotifs.forEach(n => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${n.type?.key || 'NO TYPE'}</td>
      <td>
        <select onchange="update(${n.userId}, ${n.typeId}, this.value)">
          <option value="all" ${n.mode === 'all' ? 'selected' : ''}>ALL</option>
          <option value="self" ${n.mode === 'self' ? 'selected' : ''}>SELF</option>
          <option value="none" ${n.mode === 'none' ? 'selected' : ''}>NONE</option>
        </select>
      `;

      table.appendChild(tr);
    });
}

async function update(userId, typeId, mode) {
  await fetch('/api/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ userId, typeId, mode })
  });
}

load();

</script>

</body>
</html>
