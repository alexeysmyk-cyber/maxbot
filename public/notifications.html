<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Notifications</title>
</head>

<body>

<h2>Notification Settings</h2>

<input 
type="text" 
id="search" 
placeholder="Поиск пользователя..."
oninput="render()"
/>

<br><br>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>User</th>
      <th>Role</th>
      <th>Event</th>
      <th>Mode</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

let data = [];

async function load() {
  const res = await fetch('/api/notifications');
  data = await res.json();
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const table = document.getElementById('table');

  table.innerHTML = '';

  data
    .filter(n => n.user.activeRole === 'EMPLOYEE') // 🔥 только сотрудники
    .filter(n => {
      const name = (n.user.name || '').toLowerCase();
      return name.includes(search);
    })
    .forEach(n => {

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${n.user.name || n.user.id}</td>
        <td>${n.user.activeRole}</td>
        <td>${n.type.key}</td>
        <td>
          <select onchange="update(${n.userId}, ${n.typeId}, this.value)">
            <option value="all" ${n.mode === 'all' ? 'selected' : ''}>ALL</option>
            <option value="self" ${n.mode === 'self' ? 'selected' : ''}>SELF</option>
            <option value="none" ${n.mode === 'none' ? 'selected' : ''}>NONE</option>
          </select>
        </td>
      `;

      table.appendChild(tr);
    });
}

async function update(userId, typeId, mode) {
  await fetch('/api/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ userId, typeId, mode })
  });
}

load();

</script>

</body>
</html>
