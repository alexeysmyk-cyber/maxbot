<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Notifications</title>
</head>

<body>

<h2>Notification Settings</h2>

<select id="userSelect" onchange="render()">
</select>

<br><br>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Event</th>
      <th>Mode</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

let data = [];
let users = [];

async function load() {
  const res = await fetch('/api/notifications');
  data = await res.json();

  // 🔥 собираем только сотрудников
  users = [
    ...new Map(
      data
        .filter(n => n.user.activeRole === 'EMPLOYEE')
        .map(n => [n.user.id, n.user])
    ).values()
  ];

  const select = document.getElementById('userSelect');

  users.forEach(user => {
    const option = document.createElement('option');
    option.value = user.id;
    option.textContent = user.name || `User ${user.id}`;
    select.appendChild(option);
  });

  render();
}

function render() {
  const selectedUserId = Number(document.getElementById('userSelect').value);
  const table = document.getElementById('table');

  table.innerHTML = '';

  data
    .filter(n => n.userId === selectedUserId)
    .forEach(n => {

      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td>${n.type.key}</td>
        <td>
          <select onchange="update(${n.userId}, ${n.typeId}, this.value)">
            <option value="all" ${n.mode === 'all' ? 'selected' : ''}>ALL</option>
            <option value="self" ${n.mode === 'self' ? 'selected' : ''}>SELF</option>
            <option value="none" ${n.mode === 'none' ? 'selected' : ''}>NONE</option>
          </select>
        </td>
      `;

      table.appendChild(tr);
    });
}

async function update(userId, typeId, mode) {
  await fetch('/api/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ userId, typeId, mode })
  });
}

load();

</script>

</body>
</html>
