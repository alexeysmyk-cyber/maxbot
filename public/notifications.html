<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>Notifications</title>
</head>

<body>

<h2>Notification Settings</h2>

<select id="userSelect" onchange="render()">
</select>

<br><br>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Event</th>
      <th>Mode</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

let users = [];
let types = [];
let overrides = [];

async function load() {

  const usersRes = await fetch('/api/users');
  users = await usersRes.json();

  const typesRes = await fetch('/api/types');
  types = await typesRes.json();

  const overridesRes = await fetch('/api/notifications');
  overrides = await overridesRes.json();

  console.log('USERS:', users);
  console.log('TYPES:', types);
  console.log('OVERRIDES:', overrides);

  const select = document.getElementById('userSelect');
  select.innerHTML = '';

  users.forEach(user => {
    const option = document.createElement('option');
    option.value = user.id;
    option.textContent = user.name || `User ${user.id}`;
    select.appendChild(option);
  });

  render();
}

function render() {
  const userId = Number(document.getElementById('userSelect').value);
  const table = document.getElementById('table');

  table.innerHTML = '';

  types.forEach(type => {

    // 🔍 ищем override
    const override = overrides.find(
      o => o.userId === userId && o.typeId === type.id
    );

    const mode = override ? override.mode : 'inherited';

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${type.key}</td>
      <td>
        <select onchange="update(${userId}, ${type.id}, this.value)">
          <option value="all" ${mode === 'all' ? 'selected' : ''}>ALL</option>
          <option value="self" ${mode === 'self' ? 'selected' : ''}>SELF</option>
          <option value="none" ${mode === 'none' ? 'selected' : ''}>NONE</option>
        </select>
      </td>
    `;

    table.appendChild(tr);
  });
}

async function update(userId, typeId, mode) {
  await fetch('/api/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ userId, typeId, mode })
  });
}

load();

</script>

</body>
</html>
